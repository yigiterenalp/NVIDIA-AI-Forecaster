<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVIDIA Pro - Zaman Makinesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
        .card { background-color: #161b22; border: 1px solid #30363d; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .price-big { font-size: 2.5rem; font-weight: bold; }
        .btn-nvidia { background-color: #76b900; color: #000; font-weight: bold; border: none; }
        .btn-nvidia:hover { background-color: #5d9100; color: #fff; }
        .btn-outline-secondary { color: #8b949e; border-color: #30363d; }
        .btn-outline-secondary:hover, .btn-check:checked + .btn-outline-secondary { 
            background-color: #30363d; color: #fff; border-color: #8b949e; 
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            
            <div class="text-center mb-4">
                <h1><span style="color: #76b900;">NVIDIA</span> Gelecek Projeksiyonu 🚀</h1>
                <p class="text-muted">Yapay Zeka Destekli Çoklu Zaman Analizi</p>
            </div>

            <div class="card p-3 mb-3">
                <div class="d-flex justify-content-center gap-2">
                    <input type="radio" class="btn-check" name="options" id="opt1" autocomplete="off" onclick="updateChart(7)">
                    <label class="btn btn-outline-secondary" for="opt1">1 Hafta</label>

                    <input type="radio" class="btn-check" name="options" id="opt2" autocomplete="off" checked onclick="updateChart(30)">
                    <label class="btn btn-outline-secondary" for="opt2">1 Ay</label>

                    <input type="radio" class="btn-check" name="options" id="opt3" autocomplete="off" onclick="updateChart(90)">
                    <label class="btn btn-outline-secondary" for="opt3">3 Ay</label>
                    
                    <input type="radio" class="btn-check" name="options" id="opt4" autocomplete="off" onclick="updateChart(365)">
                    <label class="btn btn-outline-secondary" for="opt4">1 Yıl (Deneysel)</label>
                </div>
            </div>

            <div class="card p-4">
                <div class="row text-center mb-4">
                    <div class="col-6 border-end border-secondary">
                        <span class="text-muted">Bugün</span>
                        <div id="currentPrice" class="price-big text-white">Yükleniyor...</div>
                    </div>
                    <div class="col-6">
                        <span id="predictionLabel" class="text-muted">Yarın (Tahmin)</span>
                        <div id="nextPrice" class="price-big" style="color: #76b900;">...</div>
                    </div>
                </div>

                <div style="height: 400px;">
                    <canvas id="stockChart"></canvas>
                </div>
            </div>
            
            <p class="text-center mt-3 small text-muted">*Uzun vadeli tahminlerde hata payı (error rate) artabilir.</p>

        </div>
    </div>
</div>

<script>
    let myChart = null;

    async function updateChart(days) {
        // 1. Elementleri Seç
        const label = document.getElementById('predictionLabel');
        const priceBox = document.getElementById('nextPrice');

        // 2. Başlığı ve Durumu Güncelle
        priceBox.innerText = "Hesaplanıyor...";
        priceBox.style.color = "#8b949e"; // Gri yap (yüklenirken)

        if (days === 7) label.innerText = "1 Hafta Sonra (Tahmin)";
        else if (days === 30) label.innerText = "1 Ay Sonra (Tahmin)";
        else if (days === 90) label.innerText = "3 Ay Sonra (Tahmin)";
        else if (days === 365) label.innerText = "1 Yıl Sonra (Tahmin)";
        else label.innerText = "Gelecek Tahmini";

        // 3. Python'dan Veri İste
        const response = await fetch('/get_prediction', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ days: days })
        });
        const data = await response.json();

        // 4. Fiyatları Yerleştir
        document.getElementById('currentPrice').innerText = "$" + data.latest_price;
        
        // Final Price'ı yaz (Seçilen dönemin sonundaki fiyat)
        priceBox.innerText = "$" + data.final_price;

        // 5. Renk Ayarı (Kar/Zarar Durumu)
        if (data.final_price >= data.latest_price) {
            priceBox.style.color = "#76b900"; // Yeşil (Yükseliş)
        } else {
            priceBox.style.color = "#ff4d4d"; // Kırmızı (Düşüş)
        }

        // 6. Grafik Verilerini Hazırla
        const historyLabels = data.history.map(d => d.date);
        const historyPrices = data.history.map(d => d.price);
        
        const forecastLabels = data.forecast.map(d => d.date);
        const forecastPrices = data.forecast.map(d => d.price);

        // 7. Chart.js Yapılandırması
        const ctx = document.getElementById('stockChart').getContext('2d');
        
        if (myChart) myChart.destroy(); 

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: historyLabels.concat(forecastLabels),
                datasets: [
                    {
                        label: 'Gerçek Veri',
                        data: historyPrices,
                        borderColor: 'rgba(255, 255, 255, 0.5)',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.1
                    },
                    {
                        label: 'AI Tahmini',
                        // Geçmiş verinin sonuna denk gelecek şekilde boşluk bırak
                        data: new Array(historyPrices.length - 1).fill(null).concat([historyPrices[historyPrices.length-1]], forecastPrices),
                        borderColor: '#76b900',
                        backgroundColor: 'rgba(118, 185, 0, 0.1)',
                        borderWidth: 2, // Tahmin çizgisi biraz daha ince olsun
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4 // Biraz daha kavisli olsun
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: 'index' },
                plugins: {
                    legend: { labels: { color: 'white' } }
                },
                scales: {
                    x: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
                    y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } }
                }
            }
        });
    }

    // Sayfa açılınca varsayılan olarak 30 günü getir
    window.onload = () => updateChart(30);
</script>

</body>
</html>
